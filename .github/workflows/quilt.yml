name: quilt

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [daily, backfill]
        default: daily
      limit:
        description: "0 = pas de limite (attention au temps CI sur un gros volume)"
        type: number
        default: 0
      offset:
        type: number
        default: 0
      reset:
        description: "Supprimer d'abord TOUS les tags déjà publiés sur Docker Hub (repart de zéro)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - docker/quilt/**
      - entrypoint/**
      - scripts/resolve_versions.py
      - .github/actions/resolve-versions/**
      - .github/actions/build-loader/**
      - .github/actions/reset-images/**
      - .github/workflows/quilt.yml

concurrency:
  group: quilt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Les runners GitHub-hosted ont une limite dure de 6h : au-delà, découpez
    # un backfill complet en plusieurs runs avec --limit/--offset.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Reset (supprime tous les tags existants)
        if: inputs.reset == true
        uses: ./.github/actions/reset-images
        with:
          loader: quilt
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Résoudre les versions à construire
        id: resolve
        uses: ./.github/actions/resolve-versions
        with:
          loader: quilt
          mode: ${{ inputs.mode || 'daily' }}
          limit: ${{ inputs.limit || 0 }}
          offset: ${{ inputs.offset || 0 }}

      - name: Construire et pousser les images (une par une, ordre chronologique)
        if: steps.resolve.outputs.count != '0'
        uses: ./.github/actions/build-loader
        with:
          loader: quilt
          matrix_file: ${{ steps.resolve.outputs.matrix_file }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}