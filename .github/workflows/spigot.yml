name: spigot

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [daily, backfill]
        default: daily
      limit:
        type: number
        default: 0
      offset:
        type: number
        default: 0
  push:
    branches: [main]
    paths:
      - docker/spigot/**
      - entrypoint/**
      - scripts/resolve_versions.py
      - .github/actions/resolve-versions/**
      - .github/actions/build-push/**
      - .github/workflows/spigot.yml

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      count: ${{ steps.resolve.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        uses: ./.github/actions/resolve-versions
        with:
          loader: spigot
          mode: ${{ inputs.mode || 'daily' }}
          limit: ${{ inputs.limit || 0 }}
          offset: ${{ inputs.offset || 0 }}

  build:
    needs: resolve
    if: needs.resolve.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-push
        with:
          loader: spigot
          mc_version: ${{ matrix.mc_version }}
          loader_version: ${{ matrix.loader_version }}
          java: ${{ matrix.java }}
          tags_json: ${{ toJson(matrix.tags) }}
          build_args_json: ${{ toJson(matrix.build_args) }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}