name: horizon

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [daily, backfill]
        default: daily
      limit:
        description: "0 = pas de limite (attention au temps CI sur un gros volume)"
        type: number
        default: 0
      offset:
        type: number
        default: 0
      reset:
        description: "Supprimer d'abord TOUS les tags déjà publiés sur Docker Hub (repart de zéro)"
        type: boolean
        default: false
concurrency:
  group: horizon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Reset (supprime tous les tags existants)
        if: inputs.reset == true
        uses: ./.github/actions/reset-images
        with:
          loader: horizon
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Résoudre les versions à construire
        id: resolve
        uses: ./.github/actions/resolve-versions
        with:
          loader: horizon
          mode: ${{ inputs.mode || 'daily' }}
          limit: ${{ inputs.limit || 0 }}
          offset: ${{ inputs.offset || 0 }}

      # Horizon publishes its prebuilt server for Linux x86_64 only.
      - name: Construire et pousser les images (une par une)
        if: steps.resolve.outputs.count != '0'
        uses: ./.github/actions/build-loader
        with:
          loader: horizon
          platforms: linux/amd64
          matrix_file: ${{ steps.resolve.outputs.matrix_file }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
