name: Build loader image (reusable)

# Workflow réutilisable : résout les versions disponibles pour un loader
# donné puis build+push chaque combinaison (mc_version, loader_version) avec
# les tags Docker calculés par scripts/resolve_versions.py.
#
# Séparateur version_mc / version_loader dans les tags : "_" (ex: 1.21.2_40.1.80)

on:
  workflow_call:
    inputs:
      loader:
        required: true
        type: string
      mode:
        required: false
        type: string
        default: daily
      limit:
        required: false
        type: number
        default: 0
      offset:
        required: false
        type: number
        default: 0

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      count: ${{ steps.build-matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les tags déjà publiés sur Docker Hub
        run: |
          set -euo pipefail
          : > known_tags.txt
          page=1
          while :; do
            resp=$(curl -fsSL "https://hub.docker.com/v2/repositories/minecraftserv/${{ inputs.loader }}/tags?page_size=100&page=${page}" || echo '{}')
            names=$(echo "$resp" | jq -r '.results[]?.name' || true)
            [ -z "$names" ] && break
            echo "$names" >> known_tags.txt
            next=$(echo "$resp" | jq -r '.next // empty')
            [ -z "$next" ] && break
            page=$((page + 1))
          done
          echo "Tags déjà publiés: $(wc -l < known_tags.txt)"

      - name: Résoudre les versions disponibles
        id: build-matrix
        run: |
          set -euo pipefail
          ARGS="--loader ${{ inputs.loader }} --mode ${{ inputs.mode }} --state-file known_tags.txt"
          if [ "${{ inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }} --offset ${{ inputs.offset }}"
          fi
          python3 scripts/resolve_versions.py $ARGS > matrix.json
          COUNT=$(jq '.include | length' matrix.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          echo "### ${{ inputs.loader }} (${{ inputs.mode }}): $COUNT job(s) à construire" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: resolve
    if: needs.resolve.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Déterminer les images Java (build/runtime)
        id: java
        run: |
          case "${{ matrix.java }}" in
            8) echo "build=eclipse-temurin:8-jdk-jammy" >> "$GITHUB_OUTPUT"; echo "runtime=eclipse-temurin:8-jre-jammy" >> "$GITHUB_OUTPUT" ;;
            11) echo "build=eclipse-temurin:11-jdk-jammy" >> "$GITHUB_OUTPUT"; echo "runtime=eclipse-temurin:11-jre-jammy" >> "$GITHUB_OUTPUT" ;;
            17) echo "build=eclipse-temurin:17-jdk-jammy" >> "$GITHUB_OUTPUT"; echo "runtime=eclipse-temurin:17-jre-jammy" >> "$GITHUB_OUTPUT" ;;
            *) echo "build=eclipse-temurin:21-jdk-jammy" >> "$GITHUB_OUTPUT"; echo "runtime=eclipse-temurin:21-jre-jammy" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Construire la liste des tags Docker
        id: tags
        run: |
          tags=""
          for t in $(echo '${{ toJson(matrix.tags) }}' | jq -r '.[]'); do
            tags="$tags,minecraftserv/${{ inputs.loader }}:$t"
          done
          echo "list=${tags#,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ inputs.loader }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            JAVA_IMAGE=${{ steps.java.outputs.build }}
            JAVA_RUNTIME_IMAGE=${{ steps.java.outputs.runtime }}
            MC_VERSION=${{ matrix.mc_version }}
            LOADER_VERSION=${{ matrix.loader_version }}
            ${{ matrix.build_args.MANIFEST_URL && format('MANIFEST_URL={0}', matrix.build_args.MANIFEST_URL) || '' }}
            ${{ matrix.build_args.JAR_URL && format('JAR_URL={0}', matrix.build_args.JAR_URL) || '' }}
            ${{ matrix.build_args.INSTALLER_URL && format('INSTALLER_URL={0}', matrix.build_args.INSTALLER_URL) || '' }}
            ${{ matrix.build_args.BUILDTOOLS_REV && format('BUILDTOOLS_REV={0}', matrix.build_args.BUILDTOOLS_REV) || '' }}
