name: Resolve Minecraft versions
description: >
  Interroge l'API officielle d'un loader (Mojang / PaperMC / Fabric / Quilt /
  Forge / NeoForge / BuildTools) et calcule la matrix de build (versions +
  tags Docker) via scripts/resolve_versions.py.

inputs:
  loader:
    description: "vanilla | bukkit | spigot | paper | forge | neoforge | fabric | quilt | velocity"
    required: true
  mode:
    description: "daily (images manquantes + correction des tags) | backfill (historique complet)"
    required: false
    default: daily
  limit:
    description: "Limite le nombre de jobs renvoyés (pagination backfill), 0 = pas de limite"
    required: false
    default: "0"
  offset:
    description: "Décalage pour la pagination backfill"
    required: false
    default: "0"

outputs:
  matrix_file:
    description: "Chemin (dans le workspace) du fichier JSON contenant la matrix"
    value: ${{ steps.build-matrix.outputs.matrix_file }}
  count:
    description: "Nombre de jobs à construire + nombre de tags à supprimer"
    value: ${{ steps.build-matrix.outputs.count }}

runs:
  using: composite
  steps:
    - name: Récupérer les tags déjà publiés sur Docker Hub
      shell: bash
      run: |
        set -euo pipefail
        # One line per tag: "<tag> <fingerprint>". The fingerprint is the
        # sorted list of the per-architecture manifest digests of the image
        # the tag points to: it does not change when a tag is re-attached
        # with imagetools, so the resolver can tell whether a tag points to
        # the right image.
        : > known_tags.txt
        page=1
        while :; do
          resp=$(curl -fsSL "https://hub.docker.com/v2/repositories/minecraftserv/${{ inputs.loader }}/tags?page_size=100&page=${page}" || echo '{}')
          lines=$(echo "$resp" | jq -r '.results[]? | "\(.name) \(((.images // []) | map(.digest // empty) | sort | join(",")) as $f | if $f == "" then (.digest // "") else $f end)"' || true)
          [ -z "$lines" ] && break
          echo "$lines" >> known_tags.txt
          next=$(echo "$resp" | jq -r '.next // empty')
          [ -z "$next" ] && break
          page=$((page + 1))
        done
        echo "Tags déjà publiés: $(wc -l < known_tags.txt)"

    - name: Résoudre les versions disponibles
      id: build-matrix
      shell: bash
      run: |
        set -euo pipefail
        ARGS="--loader ${{ inputs.loader }} --mode ${{ inputs.mode }} --state-file known_tags.txt"
        if [ "${{ inputs.limit }}" != "0" ]; then
          ARGS="$ARGS --limit ${{ inputs.limit }} --offset ${{ inputs.offset }}"
        fi
        python3 scripts/resolve_versions.py $ARGS > matrix.json
        BUILDS=$(jq '[.include[] | select(.retag_from == null)] | length' matrix.json)
        RETAGS=$(jq '[.include[] | select(.retag_from != null)] | length' matrix.json)
        DELETES=$(jq '(.delete // []) | length' matrix.json)
        echo "count=$((BUILDS + RETAGS + DELETES))" >> "$GITHUB_OUTPUT"
        echo "matrix_file=matrix.json" >> "$GITHUB_OUTPUT"
        echo "### ${{ inputs.loader }} (${{ inputs.mode }}): ${BUILDS} image(s) à construire, ${RETAGS} correction(s) de tags, ${DELETES} tag(s) obsolète(s) à supprimer" >> "$GITHUB_STEP_SUMMARY"
