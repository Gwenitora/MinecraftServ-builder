name: Reset des images Docker Hub d'un loader
description: >
  Supprime TOUTES les images publiées sur minecraftserv/<loader> : l'inventaire
  des tags et des digests se fait via l'API du registry (la même que docker
  push), puis chaque tag est effacé et chaque manifest qu'il désignait (index
  multi-arch, manifests par plateforme, attestations) est supprimé par digest.
  Le repository Docker Hub lui-même est conservé. Utile en phase de test pour
  repartir de zéro. Nécessite un Access Token Docker Hub avec les droits Read,
  Write, Delete.

inputs:
  loader:
    required: true
  dockerhub_username:
    required: true
  dockerhub_token:
    required: true

runs:
  using: composite
  steps:
    - name: Supprimer toutes les images existantes
      shell: bash
      env:
        LOADER: ${{ inputs.loader }}
        DH_USER: ${{ inputs.dockerhub_username }}
        DH_TOKEN: ${{ inputs.dockerhub_token }}
      run: |
        set -euo pipefail
        NS="minecraftserv"
        REPO="${NS}/${LOADER}"
        HUB="https://hub.docker.com/v2"
        REG_HOST="https://registry-1.docker.io"
        REG="${REG_HOST}/v2/${REPO}"
        UA="MinecraftServ-builder-reset/1.0"
        # Every manifest type buildx can push: OCI/Docker index (multi-arch),
        # then single-platform manifests (also used for attestations).
        ACCEPT="application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json"
        WORK=$(mktemp -d)
        : > "$WORK/tags"; : > "$WORK/index"; : > "$WORK/children"

        # HTTP helper: never exits on its own (no curl -f), leaves the status
        # in HTTP_CODE, the body in $WORK/body and the headers in
        # $WORK/headers, so every failure is reported with the API's message.
        HTTP_CODE=""
        http() {
          local method=$1 url=$2 token=${3:-}
          local args=(-sS -A "$UA" -o "$WORK/body" -D "$WORK/headers" -w '%{http_code}')
          # curl -X HEAD waits for a body that never comes: use -I instead.
          if [ "$method" = "HEAD" ]; then args+=(-I); else args+=(-X "$method"); fi
          [ -n "$token" ] && args+=(-H "Authorization: Bearer ${token}")
          [ -n "${HTTP_ACCEPT:-}" ] && args+=(-H "Accept: ${HTTP_ACCEPT}")
          : > "$WORK/body"; : > "$WORK/headers"
          HTTP_CODE=$(curl "${args[@]}" "$url" 2>"$WORK/curl.err" || true)
          [ -n "$HTTP_CODE" ] || HTTP_CODE=000
        }
        body() { head -c 300 "$WORK/body" 2>/dev/null | tr '\n' ' '; cat "$WORK/curl.err" 2>/dev/null | tr '\n' ' '; }
        header() { grep -i "^$1:" "$WORK/headers" | head -n1 | cut -d' ' -f2- | tr -d '\r' || true; }
        die() { echo "::error::$1 (HTTP ${HTTP_CODE}) : $(body)"; exit 1; }

        # Registry tokens (auth.docker.io) only last ~60 s: renewed every 45 s.
        REG_TOKEN=""
        REG_TOKEN_AT=-1000
        refresh_token() {
          if [ $((SECONDS - REG_TOKEN_AT)) -ge 45 ]; then
            HTTP_CODE=$(curl -sS -A "$UA" -o "$WORK/body" -w '%{http_code}' -u "${DH_USER}:${DH_TOKEN}" \
              "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${REPO}:pull,push,delete" 2>"$WORK/curl.err" || true)
            REG_TOKEN=$(jq -r '.token // .access_token // empty' "$WORK/body" 2>/dev/null || true)
            [ -n "$REG_TOKEN" ] || die "Token registry (pull,push,delete) refusé pour ${REPO}"
            REG_TOKEN_AT=$SECONDS
          fi
        }

        # Tag list through the registry API (the one docker push uses):
        # the Hub API answered 404 "object not found" from the runners, with
        # and without authentication, for repositories that do exist.
        list_tags() {
          : > "$1"
          local url="${REG}/tags/list?n=1000"
          while [ -n "$url" ]; do
            refresh_token
            http GET "$url" "$REG_TOKEN"
            [ "$HTTP_CODE" = "200" ] || die "Impossible de lister les tags de ${REPO} via le registry"
            jq -r '.tags[]? // empty' "$WORK/body" >> "$1"
            # Pagination: Link: </v2/<repo>/tags/list?n=1000&last=...>; rel="next"
            local next
            next=$(header link | sed -n 's/^<\([^>]*\)>.*rel="next".*/\1/p')
            url=""
            if [ -n "$next" ]; then url="${REG_HOST}${next}"; fi
          done
          sed -i '/^$/d' "$1"
        }

        echo "== Inventaire des tags de ${REPO} (registry) =="
        list_tags "$WORK/tags"
        n_tags=$(wc -l < "$WORK/tags")
        echo "${n_tags} tag(s) trouvé(s)"
        if [ "$n_tags" -eq 0 ]; then
          echo "### 🗑️ Reset ${REPO} : aucun tag, rien à supprimer" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        # Digest of each tag (index for multi-arch images), then the
        # manifests it references (platforms + buildx attestations).
        echo "== Résolution des digests =="
        resolve_failed=0
        while IFS= read -r tag; do
          refresh_token
          HTTP_ACCEPT="$ACCEPT" http HEAD "${REG}/manifests/${tag}" "$REG_TOKEN"
          digest=$(header docker-content-digest)
          if [ "$HTTP_CODE" != "200" ] || [ -z "$digest" ]; then
            echo "::warning::Digest introuvable pour le tag ${tag} (HTTP ${HTTP_CODE}) : son image ne sera pas supprimée."
            resolve_failed=$((resolve_failed + 1))
            continue
          fi
          echo "$digest" >> "$WORK/index"
        done < "$WORK/tags"
        sort -u "$WORK/index" -o "$WORK/index"
        while IFS= read -r d; do
          refresh_token
          HTTP_ACCEPT="$ACCEPT" http GET "${REG}/manifests/${d}" "$REG_TOKEN"
          if [ "$HTTP_CODE" = "200" ]; then
            jq -r '.manifests[]?.digest // empty' "$WORK/body" >> "$WORK/children" || true
          else
            echo "::warning::Manifest ${d} illisible (HTTP ${HTTP_CODE}) : ses manifests enfants ne seront pas supprimés."
          fi
        done < "$WORK/index"
        sort -u "$WORK/children" | grep -vxF -f "$WORK/index" > "$WORK/children.u" || true
        echo "$(wc -l < "$WORK/index") index et $(wc -l < "$WORK/children.u") manifest(s) enfant(s) à supprimer"

        # Tags through the Hub API (the registry cannot untag). If the Hub
        # API refuses, the manifests are deleted anyway: the final check
        # below tells whether the tags went with them.
        echo "== Suppression des tags (API Hub) =="
        HUB_TOKEN=$(curl -sS -A "$UA" -X POST "${HUB}/auth/token" -H "Content-Type: application/json" \
          -d "$(jq -nc --arg i "$DH_USER" --arg s "$DH_TOKEN" '{identifier: $i, secret: $s}')" \
          | jq -r '.access_token // empty' 2>/dev/null || true)
        if [ -z "$HUB_TOKEN" ]; then
          HUB_TOKEN=$(curl -sS -A "$UA" -X POST "${HUB}/users/login/" -H "Content-Type: application/json" \
            -d "$(jq -nc --arg u "$DH_USER" --arg p "$DH_TOKEN" '{username: $u, password: $p}')" \
            | jq -r '.token // empty' 2>/dev/null || true)
        fi
        tags_ok=0; tags_failed=0
        if [ -z "$HUB_TOKEN" ]; then
          echo "::warning::Authentification à l'API Hub impossible : les tags ne sont pas supprimés un par un."
          tags_failed=$n_tags
        else
          while IFS= read -r tag; do
            http DELETE "${HUB}/repositories/${REPO}/tags/${tag}/" "$HUB_TOKEN"
            case "$HTTP_CODE" in
              2*) tags_ok=$((tags_ok + 1)) ;;
              *)
                tags_failed=$((tags_failed + 1))
                # Only the first refusals are shown, to keep the log readable.
                if [ "$tags_failed" -le 3 ]; then echo "::warning::Tag ${tag} non supprimé (HTTP ${HTTP_CODE}) : $(body)"; fi
                ;;
            esac
          done < "$WORK/tags"
        fi
        echo "${tags_ok}/${n_tags} tag(s) supprimé(s) via l'API Hub"

        # Manifests by digest: indexes first (which frees their children),
        # then platform manifests and attestations.
        echo "== Suppression des images (manifests) =="
        img_ok=0; img_bg=0; img_failed=0
        delete_manifest() {
          refresh_token
          http DELETE "${REG}/manifests/$1" "$REG_TOKEN"
          case "$HTTP_CODE" in
            200|202|204|404) img_ok=$((img_ok + 1)) ;;
            # Documented: the deletion is retried by Docker Hub in the background.
            500) img_bg=$((img_bg + 1)) ;;
            *)
              img_failed=$((img_failed + 1))
              if [ "$img_failed" -le 3 ]; then echo "::warning::Manifest $1 non supprimé (HTTP ${HTTP_CODE}) : $(body)"; fi
              ;;
          esac
          return 0
        }
        while IFS= read -r d; do if [ -n "$d" ]; then delete_manifest "$d"; fi; done < "$WORK/index"
        while IFS= read -r d; do if [ -n "$d" ]; then delete_manifest "$d"; fi; done < "$WORK/children.u"

        # Final check, through the registry: what is really left.
        echo "== Vérification =="
        list_tags "$WORK/left"
        left=$(wc -l < "$WORK/left")

        summary="Reset ${REPO} : ${img_ok} manifest(s) supprimé(s)"
        if [ "$img_bg" -gt 0 ]; then summary="${summary} (+${img_bg} en cours côté Docker Hub)"; fi
        summary="${summary}, ${tags_ok}/${n_tags} tag(s) supprimé(s) via l'API Hub, ${left} tag(s) restant(s)"
        echo "== ${summary} =="
        echo "### 🗑️ ${summary}" >> "$GITHUB_STEP_SUMMARY"

        if [ "$left" -gt 0 ] || [ "$img_failed" -gt 0 ] || [ "$resolve_failed" -gt 0 ]; then
          echo "::error::Reset incomplet : ${left} tag(s) restant(s), ${img_failed} manifest(s) et ${resolve_failed} digest(s) en échec."
          exit 1
        fi
