name: Build & push loader image
description: >
  Build l'image Docker pour une combinaison (mc_version, loader_version)
  d'un loader donné et la pousse sur Docker Hub avec tous ses tags.

inputs:
  loader:
    description: "vanilla | bukkit | spigot | paper | forge | neoforge | fabric | quilt"
    required: true
  mc_version:
    required: true
  loader_version:
    required: true
  java:
    description: "Version du JDK/JRE à utiliser (8, 11, 17, 21)"
    required: true
  tags_json:
    description: "Tableau JSON des tags Docker à appliquer (ex: [\"1.21.2\",\"latest\"])"
    required: true
  build_args_json:
    description: "Objet JSON des build-args spécifiques au loader (MANIFEST_URL, JAR_URL, INSTALLER_URL, BUILDTOOLS_REV...)"
    required: true
  dockerhub_username:
    required: true
  dockerhub_token:
    required: true

runs:
  using: composite
  steps:
    - name: Déterminer les images Java (build/runtime)
      id: java
      shell: bash
      run: |
        case "${{ inputs.java }}" in
          8) echo "build=eclipse-temurin:8-jdk-jammy" >> "$GITHUB_OUTPUT"; echo "runtime=eclipse-temurin:8-jre-jammy" >> "$GITHUB_OUTPUT" ;;
          11) echo "build=eclipse-temurin:11-jdk-jammy" >> "$GITHUB_OUTPUT"; echo "runtime=eclipse-temurin:11-jre-jammy" >> "$GITHUB_OUTPUT" ;;
          17) echo "build=eclipse-temurin:17-jdk-jammy" >> "$GITHUB_OUTPUT"; echo "runtime=eclipse-temurin:17-jre-jammy" >> "$GITHUB_OUTPUT" ;;
          *) echo "build=eclipse-temurin:21-jdk-jammy" >> "$GITHUB_OUTPUT"; echo "runtime=eclipse-temurin:21-jre-jammy" >> "$GITHUB_OUTPUT" ;;
        esac

    - name: Construire la liste des tags Docker
      id: tags
      shell: bash
      run: |
        tags=""
        for t in $(echo '${{ inputs.tags_json }}' | jq -r '.[]'); do
          tags="$tags,minecraftserv/${{ inputs.loader }}:$t"
        done
        echo "list=${tags#,}" >> "$GITHUB_OUTPUT"

    - name: Construire les build-args
      id: args
      shell: bash
      run: |
        {
          echo "list<<MCSERV_EOF"
          echo "JAVA_IMAGE=${{ steps.java.outputs.build }}"
          echo "JAVA_RUNTIME_IMAGE=${{ steps.java.outputs.runtime }}"
          echo "MC_VERSION=${{ inputs.mc_version }}"
          echo "LOADER_VERSION=${{ inputs.loader_version }}"
          echo '${{ inputs.build_args_json }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"'
          echo "MCSERV_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Connexion à Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: Build & push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/${{ inputs.loader }}/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.tags.outputs.list }}
        build-args: ${{ steps.args.outputs.list }}
