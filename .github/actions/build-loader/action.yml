name: Build & push loader images sequentially
description: >
  Construit et pousse, une par une et dans l'ordre fourni par la matrix
  (tags mouvants d'abord en mode daily, puis ordre chronologique), toutes les
  images d'un loader décrites par la matrix JSON (sortie de l'action
  resolve-versions). Par défaut, un échec n'arrête plus le run : la version
  est réessayée une fois, puis notée en échec, et les suivantes sont quand
  même construites ; le job échoue à la fin s'il reste au moins un échec.

inputs:
  loader:
    description: "vanilla | bukkit | spigot | paper | forge | neoforge | fabric | quilt"
    required: true
  matrix_file:
    description: 'Chemin vers le fichier JSON {"include": [...]} (sortie de resolve-versions), lu directement sur disque pour éviter toute limite de taille des variables d''environnement/outputs GitHub Actions'
    required: true
  dockerhub_username:
    required: true
  dockerhub_token:
    required: true
  continue_on_error:
    description: "true = continuer après l'échec d'une version (échec global du job à la fin) ; false = arrêt au premier échec"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Les runners GitHub-hosted n'ont qu'environ 14 Go libres. On récupère
    # ~25 Go en supprimant des SDK préinstallés inutiles ici.
    - name: Libérer de l'espace disque
      shell: bash
      run: |
        df -h / || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
        docker image prune -af >/dev/null 2>&1 || true
        df -h / || true

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Connexion à Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: Build & push séquentiel
      shell: bash
      env:
        LOADER: ${{ inputs.loader }}
        MATRIX_FILE: ${{ inputs.matrix_file }}
        CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
      run: |
        set -euo pipefail
        # Le JSON est lu directement depuis le fichier sur disque (jamais via
        # une variable d'environnement / un output GitHub Actions), car les
        # matrices peuvent dépasser les limites de taille de l'environnement
        # d'un process (erreur "Argument list too long" observée avec des
        # matrices de ~250 Ko+, ex: vanilla/fabric en mode daily initial).
        jq -c '.include[]' "$MATRIX_FILE" > /tmp/jobs.ndjson
        TOTAL=$(wc -l < /tmp/jobs.ndjson)
        echo "== $TOTAL version(s) à construire pour $LOADER =="

        # Images Java de base tirées depuis le miroir ECR Public des images
        # officielles Docker (public.ecr.aws/docker/library) plutôt que depuis
        # Docker Hub : les pulls Docker Hub sont limités par compte/heure et
        # chaque version re-résout les images de base pour 2 architectures,
        # ce qui faisait échouer des builds à des endroits aléatoires.
        BASE="public.ecr.aws/docker/library/eclipse-temurin"

        build_one() {
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f "docker/${LOADER}/Dockerfile" \
            "${tag_args[@]}" \
            "${build_arg_args[@]}" \
            --push \
            .
        }

        i=0
        ok=0
        failed=()
        while IFS= read -r job; do
          i=$((i + 1))
          mc_version=$(echo "$job" | jq -r '.mc_version')
          loader_version=$(echo "$job" | jq -r '.loader_version')
          java=$(echo "$job" | jq -r '.java')

          case "$java" in
            8) java_build=${BASE}:8-jdk-jammy; java_runtime=${BASE}:8-jre-jammy ;;
            11) java_build=${BASE}:11-jdk-jammy; java_runtime=${BASE}:11-jre-jammy ;;
            17) java_build=${BASE}:17-jdk-jammy; java_runtime=${BASE}:17-jre-jammy ;;
            *) java_build=${BASE}:21-jdk-jammy; java_runtime=${BASE}:21-jre-jammy ;;
          esac

          tag_args=()
          while IFS= read -r t; do
            tag_args+=(-t "minecraftserv/${LOADER}:${t}")
          done < <(echo "$job" | jq -r '.tags[]')

          build_arg_args=(--build-arg "JAVA_IMAGE=${java_build}" --build-arg "JAVA_RUNTIME_IMAGE=${java_runtime}" --build-arg "MC_VERSION=${mc_version}" --build-arg "LOADER_VERSION=${loader_version}")
          while IFS= read -r kv; do
            build_arg_args+=(--build-arg "$kv")
          done < <(echo "$job" | jq -r '.build_args // {} | to_entries[] | "\(.key)=\(.value)"')

          tags_display=$(echo "$job" | jq -r '.tags | join(", ")')
          echo ""
          echo "[$i/$TOTAL] ${LOADER} ${mc_version} (loader ${loader_version}) -> ${tags_display}"

          if build_one || { echo "::warning::Échec de ${LOADER} ${mc_version}, nouvel essai dans 60 s"; sleep 60; build_one; }; then
            ok=$((ok + 1))
          else
            echo "::error::Échec du build de ${LOADER} ${mc_version} (loader ${loader_version}) après 2 essais."
            echo "--- espace disque au moment de l'échec ---"
            df -h / /var/lib/docker 2>/dev/null || true
            docker system df 2>/dev/null || true
            failed+=("${mc_version} (loader ${loader_version})")
            if [ "$CONTINUE_ON_ERROR" != "true" ]; then
              echo "### ❌ Arrêt sur ${mc_version} (loader ${loader_version}) — ${ok}/${TOTAL} version(s) construite(s) avec succès avant l'échec." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

          # Purge du cache buildx après chaque version. --keep-storage doit
          # rester nettement SOUS l'espace libre du runner : l'ancienne valeur
          # (20 Go, pour ~14 Go libres) ne déclenchait jamais la purge.
          docker buildx prune -f --keep-storage 4GB >/dev/null 2>&1 || true
        done < /tmp/jobs.ndjson

        if [ ${#failed[@]} -gt 0 ]; then
          {
            echo "### ⚠️ ${ok}/${TOTAL} version(s) construite(s) pour ${LOADER}, ${#failed[@]} en échec :"
            for f in "${failed[@]}"; do echo "- ${f}"; done
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        echo "### ✅ ${TOTAL} version(s) construite(s) avec succès pour ${LOADER}." >> "$GITHUB_STEP_SUMMARY"
