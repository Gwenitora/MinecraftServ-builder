name: Build & push loader images sequentially
description: >
  Construit et pousse, une par une et dans l'ordre chronologique, toutes les
  images d'un loader décrites par la matrix JSON fournie (sortie de l'action
  resolve-versions). S'arrête immédiatement (sans traiter les versions
  suivantes) si une version échoue à builder ou à se pousser.

inputs:
  loader:
    description: "vanilla | bukkit | spigot | paper | forge | neoforge | fabric | quilt"
    required: true
  matrix_file:
    description: 'Chemin vers le fichier JSON {"include": [...]} (sortie de resolve-versions), lu directement sur disque pour éviter toute limite de taille des variables d''environnement/outputs GitHub Actions'
    required: true
  dockerhub_username:
    required: true
  dockerhub_token:
    required: true

runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Connexion à Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: Build & push séquentiel (ordre chronologique, arrêt au premier échec)
      shell: bash
      env:
        LOADER: ${{ inputs.loader }}
        MATRIX_FILE: ${{ inputs.matrix_file }}
      run: |
        set -euo pipefail
        # Le JSON est lu directement depuis le fichier sur disque (jamais via
        # une variable d'environnement / un output GitHub Actions), car les
        # matrices peuvent dépasser les limites de taille de l'environnement
        # d'un process (erreur "Argument list too long" observée avec des
        # matrices de ~250 Ko+, ex: vanilla/fabric en mode daily initial).
        jq -c '.include[]' "$MATRIX_FILE" > /tmp/jobs.ndjson
        TOTAL=$(wc -l < /tmp/jobs.ndjson)
        echo "== $TOTAL version(s) à construire pour $LOADER (ordre chronologique) =="

        i=0
        while IFS= read -r job; do
          i=$((i + 1))
          mc_version=$(echo "$job" | jq -r '.mc_version')
          loader_version=$(echo "$job" | jq -r '.loader_version')
          java=$(echo "$job" | jq -r '.java')

          case "$java" in
            8) java_build=eclipse-temurin:8-jdk-jammy; java_runtime=eclipse-temurin:8-jre-jammy ;;
            11) java_build=eclipse-temurin:11-jdk-jammy; java_runtime=eclipse-temurin:11-jre-jammy ;;
            17) java_build=eclipse-temurin:17-jdk-jammy; java_runtime=eclipse-temurin:17-jre-jammy ;;
            *) java_build=eclipse-temurin:21-jdk-jammy; java_runtime=eclipse-temurin:21-jre-jammy ;;
          esac

          tag_args=()
          while IFS= read -r t; do
            tag_args+=(-t "minecraftserv/${LOADER}:${t}")
          done < <(echo "$job" | jq -r '.tags[]')

          build_arg_args=(--build-arg "JAVA_IMAGE=${java_build}" --build-arg "JAVA_RUNTIME_IMAGE=${java_runtime}" --build-arg "MC_VERSION=${mc_version}" --build-arg "LOADER_VERSION=${loader_version}")
          while IFS= read -r kv; do
            build_arg_args+=(--build-arg "$kv")
          done < <(echo "$job" | jq -r '.build_args // {} | to_entries[] | "\(.key)=\(.value)"')

          tags_display=$(echo "$job" | jq -r '.tags | join(", ")')
          echo ""
          echo "[$i/$TOTAL] ${LOADER} ${mc_version} (loader ${loader_version}) -> ${tags_display}"

          if ! docker buildx build \
              --platform linux/amd64,linux/arm64 \
              -f "docker/${LOADER}/Dockerfile" \
              "${tag_args[@]}" \
              "${build_arg_args[@]}" \
              --push \
              .; then
            echo "::error::Échec du build de ${LOADER} ${mc_version} (loader ${loader_version}). Arrêt : les versions suivantes ne seront pas construites."
            echo "### ❌ Arrêt sur ${mc_version} (loader ${loader_version}) — $((i - 1))/${TOTAL} version(s) construite(s) avec succès avant l'échec." >> "$GITHUB_STEP_SUMMARY"
            echo "--- espace disque au moment de l'échec ---"
            df -h / /var/lib/docker 2>/dev/null || true
            docker system df 2>/dev/null || true
            exit 1
          fi

          # Les runners GitHub-hosted n'ont qu'environ 14 Go libres : sur un
          # backfill de centaines de versions en multi-arch, le cache
          # buildx (une image temporaire par version, peu réutilisable d'une
          # version à l'autre hormis les couches de base JAVA_IMAGE/
          # JAVA_RUNTIME_IMAGE) finit par saturer le disque et fait échouer
          # un build arbitraire plus loin dans la liste (symptôme observé :
          # échecs non reproductibles en local, à une version différente à
          # chaque run). On purge donc le cache après chaque version tout en
          # gardant les couches de base (--keep-storage) pour ne pas
          # re-télécharger inutilement les images Java à chaque itération.
          docker buildx prune -f --keep-storage 20GB >/dev/null 2>&1 || true
        done < /tmp/jobs.ndjson

        echo "### ✅ ${TOTAL} version(s) construite(s) avec succès pour ${LOADER}." >> "$GITHUB_STEP_SUMMARY"
