name: Build & push loader images sequentially
description: >
  Construit et pousse, une par une et dans l'ordre fourni par la matrix
  (tags mouvants d'abord en mode daily, puis ordre chronologique), toutes les
  images d'un loader décrites par la matrix JSON (sortie de l'action
  resolve-versions). Par défaut, un échec n'arrête plus le run : la version
  est réessayée une fois, puis notée en échec, et les suivantes sont quand
  même construites ; le job échoue à la fin s'il reste au moins un échec.

inputs:
  loader:
    description: "vanilla | bukkit | spigot | paper | forge | neoforge | fabric | quilt | velocity"
    required: true
  matrix_file:
    description: 'Chemin vers le fichier JSON {"include": [...]} (sortie de resolve-versions), lu directement sur disque pour éviter toute limite de taille des variables d''environnement/outputs GitHub Actions'
    required: true
  dockerhub_username:
    required: true
  dockerhub_token:
    required: true
  continue_on_error:
    description: "true = continuer après l'échec d'une version (échec global du job à la fin) ; false = arrêt au premier échec"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # GitHub-hosted runners only have about 14 GB free. About 25 GB are
    # reclaimed by removing preinstalled SDKs that are useless here.
    - name: Libérer de l'espace disque
      shell: bash
      run: |
        df -h / || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
        docker image prune -af >/dev/null 2>&1 || true
        df -h / || true

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Connexion à Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: Build & push séquentiel
      shell: bash
      env:
        LOADER: ${{ inputs.loader }}
        MATRIX_FILE: ${{ inputs.matrix_file }}
        CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
        DH_USER: ${{ inputs.dockerhub_username }}
        DH_TOKEN: ${{ inputs.dockerhub_token }}
      run: |
        set -euo pipefail
        # The JSON is read directly from the file on disk (never through an
        # environment variable / GitHub Actions output), because matrices can
        # exceed a process's environment size limits ("Argument list too
        # long" error seen with ~250 KB+ matrices, e.g. vanilla/fabric on the
        # initial daily run).
        jq -c '.include[]' "$MATRIX_FILE" > /tmp/jobs.ndjson
        TOTAL=$(wc -l < /tmp/jobs.ndjson)
        echo "== $TOTAL version(s) à construire pour $LOADER =="

        # Java base images are pulled from the ECR Public mirror of the
        # official Docker images (public.ecr.aws/docker/library) rather than
        # from Docker Hub: Docker Hub pulls are rate limited per account/hour
        # and every version re-resolves the base images for 2 architectures,
        # which made builds fail at random points.
        BASE="public.ecr.aws/docker/library/eclipse-temurin"

        build_one() {
          # Migration job (see apply_migration in resolve_versions.py): add
          # the missing tags to an already published image, no compilation.
          if [ -n "$retag_from" ]; then
            docker buildx imagetools create "${tag_args[@]}" "minecraftserv/${LOADER}:${retag_from}"
            return
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f "docker/${LOADER}/Dockerfile" \
            "${tag_args[@]}" \
            "${build_arg_args[@]}" \
            --push \
            .
        }

        i=0
        ok=0
        failed=()
        retag_failed=0
        while IFS= read -r job; do
          i=$((i + 1))
          mc_version=$(echo "$job" | jq -r '.mc_version')
          loader_version=$(echo "$job" | jq -r '.loader_version')
          java=$(echo "$job" | jq -r '.java')
          retag_from=$(echo "$job" | jq -r '.retag_from // empty')
          marker_tag=$(echo "$job" | jq -r '.marker_tag // empty')

          case "$java" in
            8) java_build=${BASE}:8-jdk-jammy; java_runtime=${BASE}:8-jre-jammy ;;
            11) java_build=${BASE}:11-jdk-jammy; java_runtime=${BASE}:11-jre-jammy ;;
            17) java_build=${BASE}:17-jdk-jammy; java_runtime=${BASE}:17-jre-jammy ;;
            *) java_build=${BASE}:21-jdk-jammy; java_runtime=${BASE}:21-jre-jammy ;;
          esac

          tag_args=()
          while IFS= read -r t; do
            # Never publish the migration marker if an earlier retag failed:
            # the migration must then be resumed on the next daily run.
            if [ -n "$marker_tag" ] && [ "$t" = "$marker_tag" ] && [ "$retag_failed" = "1" ]; then
              echo "::warning::Migration incomplète : ${marker_tag} non publié, elle reprendra au prochain daily."
              continue
            fi
            tag_args+=(-t "minecraftserv/${LOADER}:${t}")
          done < <(echo "$job" | jq -r '.tags[]')

          build_arg_args=(--build-arg "JAVA_IMAGE=${java_build}" --build-arg "JAVA_RUNTIME_IMAGE=${java_runtime}" --build-arg "MC_VERSION=${mc_version}" --build-arg "LOADER_VERSION=${loader_version}")
          while IFS= read -r kv; do
            build_arg_args+=(--build-arg "$kv")
          done < <(echo "$job" | jq -r '.build_args // {} | to_entries[] | "\(.key)=\(.value)"')

          tags_display=$(echo "$job" | jq -r '.tags | join(", ")')
          echo ""
          if [ -n "$retag_from" ]; then
            echo "[$i/$TOTAL] ${LOADER} ${mc_version} : ajout de tag(s) sur l'image existante ${retag_from} -> ${tags_display}"
          else
            echo "[$i/$TOTAL] ${LOADER} ${mc_version} (loader ${loader_version}) -> ${tags_display}"
          fi

          if build_one || { echo "::warning::Échec de ${LOADER} ${mc_version}, nouvel essai dans 60 s"; sleep 60; build_one; }; then
            ok=$((ok + 1))
          else
            echo "::error::Échec du build de ${LOADER} ${mc_version} (loader ${loader_version}) après 2 essais."
            echo "--- espace disque au moment de l'échec ---"
            df -h / /var/lib/docker 2>/dev/null || true
            docker system df 2>/dev/null || true
            failed+=("${mc_version} (loader ${loader_version})")
            if [ -n "$retag_from" ]; then retag_failed=1; fi
            if [ "$CONTINUE_ON_ERROR" != "true" ]; then
              echo "### ❌ Arrêt sur ${mc_version} (loader ${loader_version}) — ${ok}/${TOTAL} version(s) construite(s) avec succès avant l'échec." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

          # Purge the buildx cache after each version. --keep-storage must stay
          # well BELOW the runner's free space: the old value (20 GB, for
          # ~14 GB free) never triggered the purge.
          docker buildx prune -f --keep-storage 4GB >/dev/null 2>&1 || true
        done < /tmp/jobs.ndjson

        # Stale tags listed by the resolver (e.g. an old "26-snapshot" that
        # pointed to an unrelated version): deleted through the Docker Hub API.
        mapfile -t stale < <(jq -r '(.delete // [])[]' "$MATRIX_FILE")
        if [ ${#stale[@]} -gt 0 ]; then
          echo ""
          echo "== Suppression de ${#stale[@]} tag(s) obsolète(s) =="
          JWT=$(curl -fsSL -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${DH_USER}\", \"password\": \"${DH_TOKEN}\"}" | jq -r '.token' || true)
          if [ -z "$JWT" ] || [ "$JWT" = "null" ]; then
            echo "::warning::Connexion à l'API Docker Hub impossible : tags obsolètes non supprimés."
          else
            for t in "${stale[@]}"; do
              if curl -fsS -o /dev/null -X DELETE -H "Authorization: Bearer ${JWT}" \
                "https://hub.docker.com/v2/repositories/minecraftserv/${LOADER}/tags/${t}/"; then
                echo "  - supprimé : ${t}"
              else
                echo "::warning::Impossible de supprimer le tag ${t}"
              fi
            done
            echo "### 🗑️ ${#stale[@]} tag(s) obsolète(s) supprimé(s) : ${stale[*]}" >> "$GITHUB_STEP_SUMMARY"
          fi
        fi

        if [ ${#failed[@]} -gt 0 ]; then
          {
            echo "### ⚠️ ${ok}/${TOTAL} version(s) construite(s) pour ${LOADER}, ${#failed[@]} en échec :"
            for f in "${failed[@]}"; do echo "- ${f}"; done
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        echo "### ✅ ${TOTAL} version(s) construite(s) avec succès pour ${LOADER}." >> "$GITHUB_STEP_SUMMARY"
